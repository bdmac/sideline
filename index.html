<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b3b3f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sideline" />
    <meta
      name="description"
      content="Sideline is a local-first game-day clipboard for youth soccer coaches."
    />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        try {
          const mode =
            localStorage.getItem("sideline-color-mode") === "dark"
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = mode;
          document.documentElement.dataset.colorMode = mode;
          document.documentElement.dataset.lightTheme = "light";
          document.documentElement.dataset.darkTheme = "dark_dimmed";
          document.documentElement.style.colorScheme = mode;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", mode === "dark" ? "#071315" : "#0b3b3f");
          document
            .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
            ?.setAttribute(
              "content",
              mode === "dark" ? "black-translucent" : "default",
            );
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>Sideline</title>
  </head>
  <body>
    <!--
      THESIS: Sideline is a magnetic tactics board made operational; it refuses the generic analytics-dashboard grid.
      OWN-WORLD: Ink typography, chalk surfaces, turf-teal primary state, warm orange substitutions, ruled dividers, square practical controls.
      STORY: Choose the correct squad, prepare attendance and shape, run the clock, make fair atomic changes, finish with a trustworthy record.
      FIRST VIEWPORT: Team identity and active-game status lead; on game day the pitch occupies the visual center and critical controls stay thumb-reachable.
      FORM: Operate-mode sideline clipboard, first-choice pitch-led workspace, staged as a vertical match sheet; deterministic seed: sideline-magnetic-board.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
